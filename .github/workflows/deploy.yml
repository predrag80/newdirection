name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint

      # NEXT_PUBLIC_* and APP_URL are inlined at build time, so the build needs the production values.
      - run: npm run build
        env:
          APP_URL: ${{ vars.APP_URL }}
          NEXT_PUBLIC_TURNSTILE_SITE_KEY: ${{ vars.NEXT_PUBLIC_TURNSTILE_SITE_KEY }}

      - name: Configure SSH
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/deploy_key ~/.ssh/known_hosts
          cat > ~/.ssh/config <<EOF
          Host nwd
            HostName $SSH_HOST
            User root
            IdentityFile ~/.ssh/deploy_key
            IdentitiesOnly yes
            StrictHostKeyChecking yes
          EOF

      - name: Upload release
        run: |
          RELEASE_ID="$(date -u +%Y%m%d%H%M%S)-${GITHUB_SHA::7}"
          echo "RELEASE_ID=$RELEASE_ID" >> "$GITHUB_ENV"
          rsync -az --no-owner --no-group \
            --exclude .git \
            --exclude .github \
            --exclude node_modules \
            --exclude .next/cache \
            --exclude 'out/' \
            --exclude '.env*.local' \
            ./ "nwd:/var/www/newdirection/releases/$RELEASE_ID/"

      - name: Activate release
        run: ssh nwd "bash /var/www/newdirection/releases/$RELEASE_ID/ops/deploy/activate.sh $RELEASE_ID"

      - name: Check public site
        run: curl -fsS -o /dev/null -w "%{http_code}\n" --retry 5 --retry-all-errors --retry-delay 3 "${{ vars.APP_URL }}/"
