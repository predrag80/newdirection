server {
    listen 80;
    listen [::]:80;
    server_name nwdagency.com www.nwdagency.com;

    return 301 https://nwdagency.com$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.nwdagency.com;

    ssl_certificate /etc/ssl/cloudflare/nwdagency.com.pem;
    ssl_certificate_key /etc/ssl/cloudflare/nwdagency.com.key;

    return 301 https://nwdagency.com$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name nwdagency.com;

    ssl_certificate /etc/ssl/cloudflare/nwdagency.com.pem;
    ssl_certificate_key /etc/ssl/cloudflare/nwdagency.com.key;

    client_max_body_size 16m;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    location /_next/static/ {
        proxy_pass http://127.0.0.1:3000;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location /assets/ {
        proxy_pass http://127.0.0.1:3000;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}
