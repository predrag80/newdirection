# Rejects requests that are not for nwdagency.com, such as direct hits on the server IP.
# HTTP gets no response (444); HTTPS fails the TLS handshake, so no certificate is needed here.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    listen 443 ssl http2 default_server;
    listen [::]:443 ssl http2 default_server;
    server_name _;

    ssl_reject_handshake on;
    return 444;
}
