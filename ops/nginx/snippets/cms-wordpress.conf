# Shared WordPress rules for the public and internal cms server blocks.
root /var/www/cms/public;
index index.php;
client_max_body_size 32m;

location = /xmlrpc.php { deny all; }
location ~ /\.(?!well-known) { deny all; }
location ~* ^/wp-content/uploads/.*\.php$ { deny all; }

location / {
    try_files $uri $uri/ /index.php?$args;
}

location ~ \.php$ {
    include snippets/fastcgi-php.conf;
    # TLS ends at nginx (public) or does not exist (internal); WordPress should always build https URLs.
    fastcgi_param HTTPS on;
    fastcgi_pass unix:/run/php/cms-fpm.sock;
}

location ~* \.(?:css|js|jpe?g|png|gif|webp|avif|svg|ico|woff2?)$ {
    expires 30d;
    access_log off;
    try_files $uri =404;
}
