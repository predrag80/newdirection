# WordPress as the CMS for nwdagency.com/blog.
# Public (through Cloudflare): wp-admin, REST API, uploads. The front end redirects to nwdagency.com.
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name cms.nwdagency.com;

    ssl_certificate /etc/ssl/cloudflare/nwdagency.com.pem;
    ssl_certificate_key /etc/ssl/cloudflare/nwdagency.com.key;

    include /etc/nginx/snippets/cms-wordpress.conf;
}

# Internal: Next.js reads the REST API here without leaving the server.
server {
    listen 127.0.0.1:8081;
    server_name _;

    include /etc/nginx/snippets/cms-wordpress.conf;
}
